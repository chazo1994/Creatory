name: Feature request
description: Propose a new capability aligned with roadmap/architecture.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or creator problem are you solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your proposed behavior and UX/API impact.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they are less suitable.

  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Mention impact on Director/Workflow/Bridge/MCP/RAG, if any.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues/roadmap/docs for overlap.
          required: true
        - label: I can help implement this.
          required: false
