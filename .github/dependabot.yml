version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "black"
      - dependency-name: "ruff"
      - dependency-name: "pre-commit"

  - package-ecosystem: "npm"
    directory: "/creatory_studio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions-all:
        patterns:
          - "*"
